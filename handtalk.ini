# handtalk.ini - настройки HandTalk (строки вида ключ=значение).
# Файл записывает сама программа при изменении настроек; строки с # - комментарии.

# --- Для пользователей ---
# Камера: программа запоминает последнюю выбранную в списке камер (с 0)
cameraIndex=0
# Видеофайл вместо камеры (пусто - не используется)
videoFile=
# Сколько рук отслеживать (1 или 2)
maxHands=1
# Сколько кадров держать жест до ввода буквы
stableFrames=8
# Сколько кадров без руки до пробела
spaceFrames=45
# Озвучивание: 1 - включено, 0 - выключено
speakEnabled=1
# Скорость речи (-10..10)
speechRate=0
# Громкость речи (0..100)
speechVolume=100

# --- Для разработчиков ---
# Порог уверенности для позы (0..1)
minConfidence=0.6
# Порог уверенности для движения (0..1)
dynMinConfidence=0.6
# kNN: число соседей (1..15)
knnK=5
# kNN: максимальное расстояние для позы
knnMaxDistance=0.6
# kNN: максимальное расстояние для движения
dynMaxDistance=0.5
# Скорость руки (доли размера руки за кадр): выше - движение началось
moveOn=0.025
# Скорость руки: ниже - рука стоит
moveOff=0.012
# Целевая частота кадров (5..60)
targetFps=20
# Файлы образцов и модель
samplesFile=gestures.csv
dynSamplesFile=gestures_dynamic.csv
mlpModel=models/gesture_mlp.onnx
